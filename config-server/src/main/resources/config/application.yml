spring:
  zipkin:
    base-url: ${ZIPKIN_URL:http://localhost:9411}
  tracing:
    sampling:
      probability: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
